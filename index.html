<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoBox Studio</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Utility class mirror untuk webcam */
    .mirror {
      transform: scaleX(-1);
    }
    
    /* Pre-styled photo filters */
    .filter-normal { filter: none; }
    .filter-bw { filter: grayscale(100%); }
    .filter-sepia { filter: sepia(80%); }
    .filter-vintage { filter: contrast(110%) brightness(110%) sepia(30%) hue-rotate(-10deg); }
    .filter-warm { filter: sepia(30%) saturate(140%); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans antialiased">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-rose-400">SNAP! PHOTOBOX</h1>
    </div>
    <span class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">Studio Edition</span>
  </header>

  <!-- Main Content Area -->
  <main class="container mx-auto p-4 flex-1 flex flex-col lg:flex-row gap-8 items-center justify-center my-auto">
    
    <!-- Camera Viewport Section -->
    <div class="flex flex-col items-center gap-4 w-full max-w-md">
      <div class="relative w-full aspect-[3/4] bg-slate-800 rounded-3xl overflow-hidden shadow-2xl border border-slate-700/80 flex items-center justify-center">
        
        <!-- Live Video -->
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover mirror filter-normal transition-all duration-300"></video>

        <!-- Countdown Overlay -->
        <div id="countdownOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm hidden flex-col items-center justify-center z-20">
          <span id="countdownText" class="text-9xl font-black text-white drop-shadow-lg animate-ping">3</span>
        </div>

        <!-- Camera Controls (Floating) -->
        <div class="absolute bottom-6 left-0 right-0 flex justify-center items-center gap-4 z-10">
          <button id="captureBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white p-5 rounded-full shadow-2xl hover:shadow-indigo-500/50 transition transform active:scale-90 border-4 border-slate-900 group">
            <svg class="w-8 h-8 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
              <circle cx="12" cy="13" r="3" stroke-width="2"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Filter Presets -->
      <div class="w-full bg-slate-800/40 p-3 rounded-2xl border border-slate-700/50 flex justify-around gap-1 text-xs">
        <button onclick="setFilter('filter-normal')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">Normal</button>
        <button onclick="setFilter('filter-bw')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">B&W</button>
        <button onclick="setFilter('filter-sepia')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">Sepia</button>
        <button onclick="setFilter('filter-vintage')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">Vintage</button>
        <button onclick="setFilter('filter-warm')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">Warm</button>
      </div>
    </div>

    <!-- Frame & Customization Panel -->
    <div class="w-full max-w-sm bg-slate-800/80 p-6 rounded-3xl border border-slate-700/80 shadow-xl flex flex-col gap-6">
      
      <!-- Frame Color Picker -->
      <div>
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-2">Pilih Warna Frame</h2>
        <div class="flex gap-3">
          <button onclick="setFrameColor('#1e293b')" class="w-9 h-9 rounded-full bg-slate-800 border-2 border-slate-600 focus:ring-2 focus:ring-indigo-400 transition transform hover:scale-110" title="Dark"></button>
          <button onclick="setFrameColor('#ffffff')" class="w-9 h-9 rounded-full bg-white border-2 border-slate-300 focus:ring-2 focus:ring-indigo-400 transition transform hover:scale-110" title="White"></button>
          <button onclick="setFrameColor('#f43f5e')" class="w-9 h-9 rounded-full bg-rose-500 border-2 border-rose-400 focus:ring-2 focus:ring-rose-400 transition transform hover:scale-110" title="Rose"></button>
          <button onclick="setFrameColor('#6366f1')" class="w-9 h-9 rounded-full bg-indigo-500 border-2 border-indigo-400 focus:ring-2 focus:ring-indigo-400 transition transform hover:scale-110" title="Indigo"></button>
          <button onclick="setFrameColor('#f59e0b')" class="w-9 h-9 rounded-full bg-amber-500 border-2 border-amber-400 focus:ring-2 focus:ring-amber-400 transition transform hover:scale-110" title="Amber"></button>
        </div>
      </div>

      <!-- Result Preview Box -->
      <div class="flex flex-col items-center">
        <h3 class="text-xs font-medium text-slate-400 mb-2 self-start uppercase tracking-wider">Preview Result</h3>
        
        <!-- Live Strip Container -->
        <div id="photoStrip" class="w-48 p-3 rounded-xl bg-slate-800 transition-colors duration-300 flex flex-col gap-2 shadow-2xl border border-slate-700">
          <div class="w-full aspect-[4/3] bg-slate-700/40 rounded border border-dashed border-slate-600 flex items-center justify-center text-xs text-slate-500 font-medium">Foto 1</div>
          <div class="w-full aspect-[4/3] bg-slate-700/40 rounded border border-dashed border-slate-600 flex items-center justify-center text-xs text-slate-500 font-medium">Foto 2</div>
          <div class="w-full aspect-[4/3] bg-slate-700/40 rounded border border-dashed border-slate-600 flex items-center justify-center text-xs text-slate-500 font-medium">Foto 3</div>
          
          <div class="pt-2 text-center">
            <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">SNAP! STUDIO</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-2">
        <button id="resetBtn" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium text-sm transition active:scale-95 text-slate-200">Reset</button>
        <button id="downloadBtn" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium text-sm transition active:scale-95 text-white shadow-lg shadow-indigo-600/30">Unduh Strip</button>
      </div>

    </div>

  </main>

  <!-- Hidden Processing Canvas -->
  <canvas id="hiddenCanvas" class="hidden"></canvas>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800/80">
    &copy; 2026 SNAP! PhotoBox Studio. Built for Web Browsers.
  </footer>

  <!-- JavaScript Logic -->
  <script>
    const video = document.getElementById('webcam');
    const captureBtn = document.getElementById('captureBtn');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownText = document.getElementById('countdownText');
    const photoStrip = document.getElementById('photoStrip');
    const hiddenCanvas = document.getElementById('hiddenCanvas');

    let photos = [];
    let selectedFrameColor = '#1e293b';
    let currentFilter = 'filter-normal';

    // 1. Inisialisasi Kamera
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Gagal mengakses kamera. Pastikan browser diizinkan mengakses webcam.");
        console.error("Camera access error:", err);
      }
    }

    // 2. Terapkan Filter Gambar
    function setFilter(filterClass) {
      currentFilter = filterClass;
      video.className = `w-full h-full object-cover mirror ${filterClass} transition-all duration-300`;
    }

    // 3. Kontrol Countdown & Tangkap Foto
    captureBtn.addEventListener('click', () => {
      if (photos.length >= 3) {
        alert("Strip foto sudah penuh (3/3). Klik 'Reset' untuk mengulang!");
        return;
      }
      startCountdown(3, capturePhoto);
    });

    function startCountdown(seconds, callback) {
      countdownOverlay.classList.remove('hidden');
      countdownOverlay.classList.add('flex');
      let counter = seconds;
      countdownText.innerText = counter;

      const timer = setInterval(() => {
        counter--;
        if (counter > 0) {
          countdownText.innerText = counter;
        } else {
          clearInterval(timer);
          countdownOverlay.classList.remove('flex');
          countdownOverlay.classList.add('hidden');
          callback();
        }
      }, 1000);
    }

    // 4. Tangkap Foto dari Video Stream
    function capturePhoto() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      // Mirroring canvas agar hasil sama persis dengan preview kamera
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      // Terapkan filter ke konteks canvas jika dipilih
      if (currentFilter !== 'filter-normal') {
        if (currentFilter === 'filter-bw') ctx.filter = 'grayscale(100%)';
        else if (currentFilter === 'filter-sepia') ctx.filter = 'sepia(80%)';
        else if (currentFilter === 'filter-vintage') ctx.filter = 'contrast(110%) brightness(110%) sepia(30%)';
        else if (currentFilter === 'filter-warm') ctx.filter = 'sepia(30%) saturate(140%)';
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');
      photos.push(dataUrl);
      updatePhotoStrip();
    }

    // 5. Render Hasil pada Strip Foto UI
    function updatePhotoStrip() {
      photoStrip.style.backgroundColor = selectedFrameColor;
      photoStrip.innerHTML = '';

      // Tampilkan Foto yang Sudah Diambil
      photos.forEach((src) => {
        const img = document.createElement('img');
        img.src = src;
        img.className = "w-full aspect-[4/3] object-cover rounded shadow border border-black/10";
        photoStrip.appendChild(img);
      });

      // Tampilkan Slot Placeholder
      for (let i = photos.length; i < 3; i++) {
        const placeholder = document.createElement('div');
        placeholder.className = "w-full aspect-[4/3] bg-slate-700/40 rounded border border-dashed border-slate-600 flex items-center justify-center text-xs text-slate-500 font-medium";
        placeholder.innerText = `Foto ${i + 1}`;
        photoStrip.appendChild(placeholder);
      }

      // Footer Merk Strip Foto
      const brand = document.createElement('div');
      brand.className = "pt-2 text-center";
      
      // Mengatur warna teks berdasarkan kecerahan background frame
      const isLightFrame = selectedFrameColor === '#ffffff';
      brand.innerHTML = `<span class="text-[10px] font-bold tracking-widest ${isLightFrame ? 'text-slate-800' : 'text-slate-300'} uppercase">SNAP! STUDIO</span>`;
      photoStrip.appendChild(brand);
    }

    // 6. Ganti Warna Bingkai
    function setFrameColor(color) {
      selectedFrameColor = color;
      updatePhotoStrip();
    }

    // 7. Reset Aplikasi
    document.getElementById('resetBtn').addEventListener('click', () => {
      photos = [];
      updatePhotoStrip();
    });

    // 8. Unduh Hasil Foto Strip (Canvas Rendering)
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (photos.length === 0) {
        alert("Silakan ambil minimal 1 foto terlebih dahulu!");
        return;
      }

      const canvas = hiddenCanvas;
      const ctx = canvas.getContext('2d');

      const itemWidth = 600;
      const itemHeight = 450;
      const padding = 30;
      const gap = 20;
      const footerHeight = 80;

      const totalPhotos = photos.length;
      canvas.width = itemWidth + (padding * 2);
      canvas.height = (itemHeight * totalPhotos) + (gap * (totalPhotos - 1)) + (padding * 2) + footerHeight;

      // Draw background frame
      ctx.fillStyle = selectedFrameColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let loadedCount = 0;
      photos.forEach((src, index) => {
        const img = new Image();
        img.onload = () => {
          const yPos = padding + index * (itemHeight + gap);
          ctx.drawImage(img, padding, yPos, itemWidth, itemHeight);
          loadedCount++;

          if (loadedCount === totalPhotos) {
            // Draw Branding Text
            ctx.fillStyle = (selectedFrameColor === '#ffffff') ? '#1e293b' : '#ffffff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SNAP! PHOTOBOX STUDIO', canvas.width / 2, canvas.height - 35);

            // Export to File Image Download
            const link = document.createElement('a');
            link.download = `photobox-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          }
        };
        img.src = src;
      });
    });

    // Jalankan Kamera
    initCamera();
  </script>
</body>
</html>
