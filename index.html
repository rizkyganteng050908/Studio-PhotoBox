<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAP Studio - Photobox Canvas with Live Camera & Custom Frame Overlay</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #photoboxCanvas {
      max-height: 80vh;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 py-4 px-6 mb-8 shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight text-indigo-600">SNAP Studio <span class="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded-full font-normal">Photobox Canvas</span></h1>
      <span class="text-sm text-gray-500">Live Camera & Custom Frame Overlay</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Control Panel (Left Sidebar) -->
      <div class="lg:col-span-5 bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-6">
        <div>
          <h2 class="text-lg font-semibold mb-1">Pengaturan Canvas & Kamera</h2>
          <p class="text-sm text-gray-500">Gunakan live kamera atau upload file foto & frame PNG transparan.</p>
        </div>

        <hr class="border-gray-100" />

        <!-- Fitur Live Camera Feed -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-gray-700">1. Live Camera Preview</label>
          <div class="relative w-full aspect-video bg-gray-900 rounded-xl overflow-hidden border border-gray-300 flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-800 text-gray-400 p-4 text-center">
              <svg class="w-8 h-8 mb-2 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
              <p class="text-xs">Kamera belum diaktifkan</p>
            </div>
            <!-- Countdown Overlay -->
            <div id="countdown" class="hidden absolute inset-0 bg-black/50 text-white font-bold text-6xl flex items-center justify-center animate-pulse">
              3
            </div>
          </div>
          <button id="startCamBtn" class="w-full py-2 px-4 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold text-sm rounded-xl transition">
            Aktifkan Kamera
          </button>
        </div>

        <!-- Slot Input Foto (Live Snap / Upload) -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">2. Ambil / Upload Foto (3 Slot)</label>
          <div class="grid grid-cols-3 gap-2">
            <!-- Slot 1 -->
            <div class="space-y-1">
              <span class="block text-xs text-center text-gray-500">Foto #1</span>
              <button onclick="capturePhoto(0)" class="w-full py-2 bg-indigo-600 text-white text-xs font-medium rounded-lg hover:bg-indigo-700 transition">
                📸 Snap 1
              </button>
              <input type="file" id="photo0" accept="image/*" class="photo-input hidden" data-index="0" />
              <button onclick="document.getElementById('photo0').click()" class="w-full py-1 text-[11px] text-gray-500 hover:underline text-center block">
                Upload
              </button>
            </div>
            <!-- Slot 2 -->
            <div class="space-y-1">
              <span class="block text-xs text-center text-gray-500">Foto #2</span>
              <button onclick="capturePhoto(1)" class="w-full py-2 bg-indigo-600 text-white text-xs font-medium rounded-lg hover:bg-indigo-700 transition">
                📸 Snap 2
              </button>
              <input type="file" id="photo1" accept="image/*" class="photo-input hidden" data-index="1" />
              <button onclick="document.getElementById('photo1').click()" class="w-full py-1 text-[11px] text-gray-500 hover:underline text-center block">
                Upload
              </button>
            </div>
            <!-- Slot 3 -->
            <div class="space-y-1">
              <span class="block text-xs text-center text-gray-500">Foto #3</span>
              <button onclick="capturePhoto(2)" class="w-full py-2 bg-indigo-600 text-white text-xs font-medium rounded-lg hover:bg-indigo-700 transition">
                📸 Snap 3
              </button>
              <input type="file" id="photo2" accept="image/*" class="photo-input hidden" data-index="2" />
              <button onclick="document.getElementById('photo2').click()" class="w-full py-1 text-[11px] text-gray-500 hover:underline text-center block">
                Upload
              </button>
            </div>
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- Custom Frame Overlay -->
        <div class="space-y-2">
          <label for="overlayInput" class="block text-sm font-medium text-gray-700">
            3. Upload Custom Frame (PNG Transparan)
          </label>
          <input 
            type="file" 
            id="overlayInput" 
            accept="image/png" 
            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition cursor-pointer border border-gray-200 rounded-xl"
          />
          <div id="overlayStatus" class="hidden flex items-center justify-between bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-2.5 rounded-xl mt-2">
            <span>✓ Custom Frame Aktif</span>
            <button id="removeOverlayBtn" class="font-bold underline hover:text-emerald-900">Hapus Frame</button>
          </div>
        </div>

        <!-- Background Color -->
        <div class="space-y-2">
          <label for="bgColorInput" class="block text-sm font-medium text-gray-700">
            4. Warna Background Strip
          </label>
          <div class="flex items-center gap-3">
            <input type="color" id="bgColorInput" value="#ffffff" class="h-10 w-20 p-1 border border-gray-200 rounded-xl cursor-pointer" />
            <span id="colorHex" class="text-xs text-gray-500 font-mono">#FFFFFF</span>
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- Download Button -->
        <button 
          id="downloadBtn" 
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-100 transition duration-200 flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download Hasil Photobox
        </button>
      </div>

      <!-- Canvas Preview Area -->
      <div class="lg:col-span-7 flex flex-col items-center justify-center bg-gray-200/50 p-6 rounded-2xl border border-dashed border-gray-300 min-h-[600px]">
        <p class="text-xs text-gray-400 font-medium mb-3">CANVAS PREVIEW (600 x 1800 px)</p>
        <canvas id="photoboxCanvas" width="600" height="1800" class="w-auto h-auto rounded-lg bg-white"></canvas>
      </div>

    </div>
  </main>

  <script>
    // State Manager
    const state = {
      canvas: document.getElementById('photoboxCanvas'),
      ctx: document.getElementById('photoboxCanvas').getContext('2d'),
      photos: [null, null, null],
      overlayImage: null,
      bgColor: '#ffffff',
      webcamStream: null
    };

    // DOM Elements
    const video = document.getElementById('webcam');
    const startCamBtn = document.getElementById('startCamBtn');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const countdownEl = document.getElementById('countdown');
    const overlayInput = document.getElementById('overlayInput');
    const removeOverlayBtn = document.getElementById('removeOverlayBtn');
    const overlayStatus = document.getElementById('overlayStatus');
    const bgColorInput = document.getElementById('bgColorInput');
    const colorHex = document.getElementById('colorHex');
    const downloadBtn = document.getElementById('downloadBtn');
    const photoInputs = document.querySelectorAll('.photo-input');

    // Initialize Canvas
    window.addEventListener('DOMContentLoaded', () => {
      renderCanvas();
    });

    // 1. Live Camera Stream Handling
    startCamBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: false
        });
        state.webcamStream = stream;
        video.srcObject = stream;
        cameraPlaceholder.classList.add('hidden');
        startCamBtn.textContent = 'Kamera Aktif';
        startCamBtn.classList.replace('bg-indigo-50', 'bg-emerald-50');
        startCamBtn.classList.replace('text-indigo-600', 'text-emerald-600');
      } catch (err) {
        alert('Gagal mengakses kamera. Pastikan izin kamera telah diberikan.');
        console.error(err);
      }
    });

    // 2. Capture Photo from Live Feed with 3s Countdown
    function capturePhoto(slotIndex) {
      if (!state.webcamStream) {
        alert('Aktifkan kamera terlebih dahulu!');
        return;
      }

      let count = 3;
      countdownEl.textContent = count;
      countdownEl.classList.remove('hidden');

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          clearInterval(timer);
          countdownEl.classList.add('hidden');
          
          // Take Snapshot from Video Frame
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = video.videoWidth || 640;
          tempCanvas.height = video.videoHeight || 480;
          const tempCtx = tempCanvas.getContext('2d');

          // Mirror horizontally for selfie webcam
          tempCtx.translate(tempCanvas.width, 0);
          tempCtx.scale(-1, 1);
          tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

          const img = new Image();
          img.onload = () => {
            state.photos[slotIndex] = img;
            renderCanvas();
          };
          img.src = tempCanvas.toDataURL('image/png');
        }
      }, 1000);
    }

    // 3. Handler Upload File Photo Manual
    photoInputs.forEach((input) => {
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        const index = parseInt(e.target.dataset.index);
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            state.photos[index] = img;
            renderCanvas();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    // 4. Handler Custom PNG Frame Overlay
    overlayInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type !== 'image/png') {
        alert('Harap unggah file PNG transparan!');
        overlayInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          state.overlayImage = img;
          overlayStatus.classList.remove('hidden');
          renderCanvas();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    removeOverlayBtn.addEventListener('click', () => {
      state.overlayImage = null;
      overlayInput.value = '';
      overlayStatus.classList.add('hidden');
      renderCanvas();
    });

    // 5. Background Color Input
    bgColorInput.addEventListener('input', (e) => {
      state.bgColor = e.target.value;
      colorHex.textContent = e.target.value.toUpperCase();
      renderCanvas();
    });

    // 6. Core Render Engine Canvas
    function renderCanvas() {
      const { canvas, ctx, photos, overlayImage, bgColor } = state;

      // Layer 1: Background Color
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Layer 2: Photos Grid (3 Slot Vertikal)
      const photoWidth = 520;
      const photoHeight = 390;
      const startX = 40;
      const startY = 50;
      const gapY = 40;

      photos.forEach((img, idx) => {
        const currentY = startY + idx * (photoHeight + gapY);

        if (img) {
          drawCoverImage(ctx, img, startX, currentY, photoWidth, photoHeight);
        } else {
          // Placeholder Box
          ctx.fillStyle = '#f3f4f6';
          ctx.fillRect(startX, currentY, photoWidth, photoHeight);
          ctx.fillStyle = '#9ca3af';
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`Slot Foto #${idx + 1}`, canvas.width / 2, currentY + photoHeight / 2);
        }
      });

      // Layer 3: Custom Frame PNG Overlay (Berada di Atas Layer Foto)
      if (overlayImage) {
        ctx.drawImage(overlayImage, 0, 0, canvas.width, canvas.height);
      }
    }

    // Fit Crop & Center Foto ke Box Slot
    function drawCoverImage(ctx, img, x, y, w, h) {
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;
      let sx, sy, sw, sh;

      if (imgRatio > targetRatio) {
        sh = img.height;
        sw = img.height * targetRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = img.width / targetRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    // 7. Download Final Canvas
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `SNAP_Studio_${Date.now()}.png`;
      link.href = state.canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
