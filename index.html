<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAP Studio - Photobox Canvas with Custom Frame Overlay</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Styling canvas preview */
    #photoboxCanvas {
      max-height: 80vh;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 py-4 px-6 mb-8 shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight text-indigo-600">SNAP Studio <span class="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded-full font-normal">Photobox Canvas</span></h1>
      <span class="text-sm text-gray-500">Custom Frame Overlay Feature</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Control Panel (Left Sidebar) -->
      <div class="lg:col-span-5 bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-6">
        <div>
          <h2 class="text-lg font-semibold mb-1">Pengaturan Canvas</h2>
          <p class="text-sm text-gray-500">Unggah foto dan bingkai kustom berformat PNG transparan.</p>
        </div>

        <hr class="border-gray-100" />

        <!-- Input 1: Custom Frame PNG Overlay -->
        <div class="space-y-2">
          <label for="overlayInput" class="block text-sm font-medium text-gray-700">
            1. Upload Custom Frame (PNG Transparan)
          </label>
          <input 
            type="file" 
            id="overlayInput" 
            accept="image/png" 
            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition cursor-pointer border border-gray-200 rounded-xl"
          />
          <div id="overlayStatus" class="hidden flex items-center justify-between bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-2.5 rounded-xl mt-2">
            <span>✓ Overlay Frame Aktif</span>
            <button id="removeOverlayBtn" class="font-bold underline hover:text-emerald-900">Hapus Frame</button>
          </div>
        </div>

        <!-- Input 2: Photos Input -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">
            2. Upload 3 Foto Photobox
          </label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label for="photo0" class="block text-xs text-center text-gray-500 mb-1">Foto #1</label>
              <input type="file" id="photo0" accept="image/*" class="photo-input hidden" data-index="0" />
              <button onclick="document.getElementById('photo0').click()" class="w-full h-20 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-xs text-gray-400 hover:border-indigo-400 hover:text-indigo-500 transition">
                + Foto 1
              </button>
            </div>
            <div>
              <label for="photo1" class="block text-xs text-center text-gray-500 mb-1">Foto #2</label>
              <input type="file" id="photo1" accept="image/*" class="photo-input hidden" data-index="1" />
              <button onclick="document.getElementById('photo1').click()" class="w-full h-20 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-xs text-gray-400 hover:border-indigo-400 hover:text-indigo-500 transition">
                + Foto 2
              </button>
            </div>
            <div>
              <label for="photo2" class="block text-xs text-center text-gray-500 mb-1">Foto #3</label>
              <input type="file" id="photo2" accept="image/*" class="photo-input hidden" data-index="2" />
              <button onclick="document.getElementById('photo2').click()" class="w-full h-20 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-xs text-gray-400 hover:border-indigo-400 hover:text-indigo-500 transition">
                + Foto 3
              </button>
            </div>
          </div>
        </div>

        <!-- Input 3: Background Color -->
        <div class="space-y-2">
          <label for="bgColorInput" class="block text-sm font-medium text-gray-700">
            3. Warna Background Strip
          </label>
          <div class="flex items-center gap-3">
            <input type="color" id="bgColorInput" value="#ffffff" class="h-10 w-20 p-1 border border-gray-200 rounded-xl cursor-pointer" />
            <span id="colorHex" class="text-xs text-gray-500 font-mono">#FFFFFF</span>
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- Download Button -->
        <button 
          id="downloadBtn" 
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-100 transition duration-200 flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download Hasil Photobox
        </button>
      </div>

      <!-- Canvas Preview Area (Right Side) -->
      <div class="lg:col-span-7 flex flex-col items-center justify-center bg-gray-200/50 p-6 rounded-2xl border border-dashed border-gray-300 min-h-[600px]">
        <p class="text-xs text-gray-400 font-medium mb-3">CANVAS PREVIEW (600 x 1800 px)</p>
        
        <!-- Canvas Tag -->
        <canvas id="photoboxCanvas" width="600" height="1800" class="w-auto h-auto rounded-lg bg-white"></canvas>
      </div>

    </div>
  </main>

  <script>
    // State Application
    const state = {
      canvas: document.getElementById('photoboxCanvas'),
      ctx: document.getElementById('photoboxCanvas').getContext('2d'),
      photos: [null, null, null], // Menampung 3 objek Image foto
      overlayImage: null,          // Menampung objek Image frame PNG
      bgColor: '#ffffff'           // Warna latar belakang default
    };

    // DOM Elements
    const overlayInput = document.getElementById('overlayInput');
    const removeOverlayBtn = document.getElementById('removeOverlayBtn');
    const overlayStatus = document.getElementById('overlayStatus');
    const bgColorInput = document.getElementById('bgColorInput');
    const colorHex = document.getElementById('colorHex');
    const downloadBtn = document.getElementById('downloadBtn');
    const photoInputs = document.querySelectorAll('.photo-input');

    // Init Redraw
    window.addEventListener('DOMContentLoaded', () => {
      renderCanvas();
    });

    // 1. Handler Upload Overlay PNG Frame
    overlayInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type !== 'image/png') {
        alert('Harap masukkan file berformat PNG transparan untuk frame!');
        overlayInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          state.overlayImage = img;
          overlayStatus.classList.remove('hidden');
          renderCanvas();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Remove Overlay Frame
    removeOverlayBtn.addEventListener('click', () => {
      state.overlayImage = null;
      overlayInput.value = '';
      overlayStatus.classList.add('hidden');
      renderCanvas();
    });

    // 2. Handler Upload Individual Photos
    photoInputs.forEach((input) => {
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        const index = parseInt(e.target.dataset.index);
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            state.photos[index] = img;
            
            // Highlight button slot UI
            const btn = e.target.nextElementSibling;
            btn.classList.remove('border-dashed', 'border-gray-300', 'text-gray-400');
            btn.classList.add('border-solid', 'border-emerald-500', 'bg-emerald-50', 'text-emerald-600');
            btn.textContent = `✓ Foto ${index + 1}`;

            renderCanvas();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    // 3. Handler Background Color Change
    bgColorInput.addEventListener('input', (e) => {
      state.bgColor = e.target.value;
      colorHex.textContent = e.target.value.toUpperCase();
      renderCanvas();
    });

    // 4. Core Render Engine Canvas
    function renderCanvas() {
      const { canvas, ctx, photos, overlayImage, bgColor } = state;

      // Layer 1: Background Color
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Layer 2: Draw Snapshot Photos (3 Slot Layout Vertikal)
      const photoWidth = 520;
      const photoHeight = 390;
      const startX = 40;
      const startY = 50;
      const gapY = 40;

      photos.forEach((img, idx) => {
        const currentY = startY + idx * (photoHeight + gapY);

        if (img) {
          // Object-fit cover effect pada canvas slot
          drawCoverImage(ctx, img, startX, currentY, photoWidth, photoHeight);
        } else {
          // Placeholder Box untuk slot foto kosong
          ctx.fillStyle = '#f3f4f6';
          ctx.fillRect(startX, currentY, photoWidth, photoHeight);
          ctx.fillStyle = '#9ca3af';
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`Slot Foto #${idx + 1}`, canvas.width / 2, currentY + photoHeight / 2);
        }
      });

      // Layer 3: Custom Overlay Frame PNG (Rendered Paling Atas Menutupi Foto)
      if (overlayImage) {
        ctx.drawImage(overlayImage, 0, 0, canvas.width, canvas.height);
      }
    }

    // Utility: Crop & Center Fit Foto ke dalam Box Slot (Object-Fit: Cover)
    function drawCoverImage(ctx, img, x, y, w, h) {
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;
      let sx, sy, sw, sh;

      if (imgRatio > targetRatio) {
        sh = img.height;
        sw = img.height * targetRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = img.width / targetRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    // 5. Download Canvas Result
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `SNAP_Studio_${Date.now()}.png`;
      link.href = state.canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
